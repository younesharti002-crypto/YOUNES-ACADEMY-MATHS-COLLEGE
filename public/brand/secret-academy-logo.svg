<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">THE SECRET ACADEMY logo</title>
  <desc id="desc">Navy and gold academy logo with an open book and golden key.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#0b2035"/>
      <stop offset="72%" stop-color="#031020"/>
      <stop offset="100%" stop-color="#020812"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#fff1a6"/>
      <stop offset="38%" stop-color="#d7a935"/>
      <stop offset="72%" stop-color="#f2cf6a"/>
      <stop offset="100%" stop-color="#a87112"/>
    </linearGradient>
    <linearGradient id="page" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="65%" stop-color="#fff7dc"/>
      <stop offset="100%" stop-color="#b9892a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)"/>
  <circle cx="600" cy="332" r="126" fill="none" stroke="url(#gold)" stroke-width="34" filter="url(#shadow)"/>
  <path d="M600 466v175" stroke="url(#gold)" stroke-width="34" stroke-linecap="round"/>
  <path d="M600 545h74M600 608h55" stroke="url(#gold)" stroke-width="28" stroke-linecap="round"/>
  <g stroke="url(#gold)" stroke-width="14" stroke-linecap="round">
    <path d="M600 140v76"/>
    <path d="M472 170l38 66"/>
    <path d="M365 255l66 38"/>
    <path d="M735 170l-38 66"/>
    <path d="M842 255l-66 38"/>
    <path d="M320 380h76"/>
    <path d="M805 380h76"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M195 395c145 5 257 52 366 154v237c-98-82-213-133-366-140z" fill="url(#gold)" opacity=".92"/>
    <path d="M1005 395c-145 5-257 52-366 154v237c98-82 213-133 366-140z" fill="url(#gold)" opacity=".92"/>
    <path d="M230 335c125 21 230 72 331 171v210c-88-75-194-124-331-147z" fill="url(#page)"/>
    <path d="M970 335c-125 21-230 72-331 171v210c88-75 194-124 331-147z" fill="url(#page)"/>
    <path d="M600 520c-26 52-43 109-52 172 35-21 70-21 104 0-9-63-26-120-52-172z" fill="url(#gold)"/>
    <path d="M304 430c77 19 150 55 219 109M304 492c77 18 150 52 219 101M896 430c-77 19-150 55-219 109M896 492c-77 18-150 52-219 101" stroke="#b88924" stroke-width="10" stroke-linecap="round" opacity=".65"/>
  </g>

  <text x="600" y="850" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="128" font-weight="700" letter-spacing="4" fill="#ffffff">THE <tspan fill="url(#gold)">SECRET</tspan></text>
  <g fill="#ffffff">
    <text x="600" y="952" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="72" letter-spacing="46">ACADEMY</text>
  </g>
  <g stroke="url(#gold)" stroke-width="9" stroke-linecap="round">
    <path d="M144 932h160"/>
    <path d="M896 932h160"/>
  </g>
  <text x="600" y="1065" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" letter-spacing="22" fill="#ffffff">LEARN • GROW • SUCCEED</text>
